# Eigene Fehlerseiten.
# Einbinden im server-Block von (/etc/nginx/conf.d/...):
#   include snippets/error-pages.conf;
#
# Die Seiten liegen ausserhalb von /var/www/docs, weil das Upload-Skript
# dieses Verzeichnis bei jedem Deploy komplett neu anlegt.

error_page 404 /_error/404.html;
error_page 500 502 /_error/502.html;
error_page 503 /_error/503.html;
error_page 504 /_error/504.html;

location = /_error/404.html {
    alias /var/www/errors/404.html;
    internal;
}

location = /_error/502.html {
    alias /var/www/errors/502.html;
    internal;
    add_header Cache-Control "no-store" always;
}

location = /_error/503.html {
    alias /var/www/errors/503.html;
    internal;
    add_header Cache-Control "no-store" always;
}

location = /_error/504.html {
    alias /var/www/errors/504.html;
    internal;
    add_header Cache-Control "no-store" always;
}

# Logo und Favicon der Fehlerseiten; bewusst ohne "internal", sonst laedt der Browser sie nicht.
location ^~ /_error/ {
    alias /var/www/errors/;
    autoindex off;
    access_log off;
}
