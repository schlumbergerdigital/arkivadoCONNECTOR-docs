# Eigene Fehlerseite fuer den Doku-Server.
# Einbinden im server-Block von docs.arkivado.digital (/etc/nginx/conf.d/...):
#   include snippets/docs-error-pages.conf;
#
# Die Seite liegt ausserhalb von /var/www/docs, weil das Upload-Skript
# dieses Verzeichnis bei jedem Deploy komplett neu anlegt.

error_page 404 /_error/404.html;

location = /_error/404.html {
    alias /var/www/errors/404.html;
    internal;
}
