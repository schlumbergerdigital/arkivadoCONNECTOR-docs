# Legacy-Dokumentation aus dem Google-Index halten.
#
# Einbinden im server-Block von legacy.docs.arkivado.digital:
#   include snippets/legacy-noindex.conf;
#
# Die Alt-Doku behandelt dieselben Themen wie docs.arkivado.digital und wuerde
# sonst mit der aktuellen Doku um dieselben Suchbegriffe konkurrieren.
# "noindex" nimmt die Seiten aus dem Index, "follow" laesst Google den Links
# weiterhin folgen, damit die Linkkraft auf die neue Doku uebergeht.

add_header X-Robots-Tag "noindex, follow" always;

location = /robots.txt {
    add_header Content-Type text/plain;
    return 200 "User-agent: *\nDisallow:\n";
}
