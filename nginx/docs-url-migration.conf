# 301-Weiterleitungen fuer die URL-Umstellung der arkivado CONNECTOR Doku.
#
# Einbinden im server-Block von docs.arkivado.digital:
#   include snippets/docs-url-migration.conf;
# Die Datei gehoert nach /etc/nginx/snippets/ und muss UTF-8-kodiert sein.
#
# Hintergrund: Die Doku wurde auf saubere Verzeichnis-URLs umgestellt
# (/changelog/ statt /changelog.html) und die Dateinamen wurden auf
# Kleinschreibung ohne Leerzeichen und Umlaute normalisiert. Ohne diese
# Weiterleitungen wuerden alle bereits indexierten Adressen mit 404 antworten
# und die bestehenden Rankings verloren gehen.
#
# nginx vergleicht location-Ausdruecke mit der dekodierten URI, deshalb stehen
# hier Leerzeichen und Umlaute im Klartext statt als %20 bzw. %C3%9C.

# --- Startseite und Top-Level-Seiten -----------------------------------------
location = /index.html    { return 301 https://docs.arkivado.digital/; }
location = /changelog.html { return 301 https://docs.arkivado.digital/changelog/; }
location = /download.html  { return 301 https://docs.arkivado.digital/download/; }
location = /cronjobs.html  { return 301 https://docs.arkivado.digital/cronjobs/; }

# --- Bereichs-Startseiten ----------------------------------------------------
location = /config/index.html          { return 301 https://docs.arkivado.digital/config/; }
location = /grundeinrichtung/index.html { return 301 https://docs.arkivado.digital/grundeinrichtung/; }
location = /ki/index.html              { return 301 https://docs.arkivado.digital/ki/; }
location = /datev/index.html           { return 301 https://docs.arkivado.digital/datev/; }
location = /sepa/index.html            { return 301 https://docs.arkivado.digital/sepa/; }
location = /dateien/index.html         { return 301 https://docs.arkivado.digital/dateien/; }
location = /xml/index.html             { return 301 https://docs.arkivado.digital/xml/; }

# --- Grundeinrichtung --------------------------------------------------------
location = "/grundeinrichtung/Vorbereitung ecoDMS.html" { return 301 https://docs.arkivado.digital/grundeinrichtung/vorbereitung-ecodms/; }
location = "/grundeinrichtung/Erster Start.html"        { return 301 https://docs.arkivado.digital/grundeinrichtung/erster-start/; }

# --- KI ----------------------------------------------------------------------
location = "/ki/Konfiguration.html" { return 301 https://docs.arkivado.digital/ki/konfiguration/; }
location = "/ki/E-Rechnung.html"    { return 301 https://docs.arkivado.digital/ki/e-rechnung/; }

# --- DATEV -------------------------------------------------------------------
location = "/datev/Konfiguration ecoDMS-datev.html" { return 301 https://docs.arkivado.digital/datev/konfiguration-ecodms-datev/; }
location = "/datev/Konfiguration DATEV DUO.html"    { return 301 https://docs.arkivado.digital/datev/konfiguration-datev-duo/; }
location = "/datev/004 Konfiguration DATEV.html"    { return 301 https://docs.arkivado.digital/datev/konfiguration-datev/; }
location = "/datev/005 Erste Übertragung.html"      { return 301 https://docs.arkivado.digital/datev/erste-uebertragung/; }

# --- SEPA / Datei / XML ------------------------------------------------------
location = "/sepa/Konfiguration SEPA.html"          { return 301 https://docs.arkivado.digital/sepa/konfiguration-sepa/; }
location = "/dateien/Konfiguration Dateiexport.html" { return 301 https://docs.arkivado.digital/dateien/konfiguration-dateiexport/; }
location = "/xml/Konfiguration XML.html"            { return 301 https://docs.arkivado.digital/xml/konfiguration-xml/; }

# --- Sammelregeln ------------------------------------------------------------
# Alte Grossschreibung des KI-Ordners abfangen.
location ~* "^/KI/(?<ki_rest>.*)$" {
    return 301 https://docs.arkivado.digital/ki/$ki_rest;
}

# /pfad/index.html ist identisch zu /pfad/ - Duplicate Content vermeiden.
location ~ "^(?<dir>/.+)/index\.html$" {
    return 301 https://docs.arkivado.digital$dir/;
}
