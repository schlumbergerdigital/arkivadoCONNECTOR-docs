# Weiterleitung der alten Doku-Routen auf die Legacy-Subdomain.
# Einbinden im server-Block von docs.arkivado.digital (/etc/nginx/conf.d/...):
#   include snippets/docs-legacy-redirects.conf;
# Die Datei selbst gehoert nach /etc/nginx/snippets/, nicht nach conf.d,
# da conf.d direkt im http-Kontext eingebunden wird.
#
# $request_uri enthaelt die unveraenderte (noch kodierte) URI inkl. Query-String,
# dadurch bleiben %20 und Unterrouten beim Redirect erhalten.
# nginx matcht location gegen die dekodierte URI, (%20|\s) faengt beide Varianten ab.

location ~* "^/(arkivado(%20|\s)ecodms(%20|\s)(tool|connector)|arkivado(%20|\s)up|turm\.ai)(/|$)" {
    return 301 https://legacy.docs.arkivado.digital$request_uri;
}
