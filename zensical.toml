site_url = "https://docs.arkivado.digital/"
# Saubere Verzeichnis-URLs ohne .html (wird vom offline-Plugin ausgehebelt)
use_directory_urls = true
site_name = "arkivado CONNECTOR Dokumentation"
site_description = "Dokumentation für den arkivado CONNECTOR: ecoDMS mit DATEV, DATEV Unternehmen Online, Datei-, XML-, SEPA- und KI-Export verbinden."
site_author = "schlumberger digital e.K."

copyright = "Copyright &copy; 2026 schlumberger digital e.K"

# repo_url = "https://github.com/schlumbergerdigital/arkivadoCONNECTOR-docs"
# repo_name = "arkivadoCONNECTOR-docs"
# edit_uri = "edit/main/docs/"



extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/extra.js"]

[project.extra]
# Vorschaubild fuer Social-Previews, relativ zu site_url; pro Seite ueber "image" im Frontmatter ueberschreibbar
social_image = "arkivado-datev.png"
generator = false

[project.theme]
name = "material"
# variant = "classic"
custom_dir = "overrides"
favicon = "favicon-sd.svg"
language = "de"
# Systemschriften statt Google Fonts: kein externer Request, besseres LCP
font = false
features = [
  # "navigation.sections",  # würde Gruppen flach ausklappen statt einklappbar
  "navigation.path",
  "navigation.instant",
  #"navigation.tabs",
  "content.code.copy",
  "content.code.annotate",
    "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  # "navigation.sections",
  # "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate"
]

logo = "96-quer-schlumberger-digital-logo.png"

