# code = "Jetbrains Mono"

# Farben entsprechen den Themes "Hell" und "Schwarz" der Anwendung,
# die konkreten Werte stehen in docs/stylesheets/extra.css
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "white"
accent = "blue"
toggle = { icon = "material/weather-night", name = "Zum dunklen Modus wechseln" }

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle = { icon = "material/weather-sunny", name = "Zum hellen Modus wechseln" }

[project.plugins]
search = {}

# Offline-Modus laedt einen externen unpkg-Shim und ist nur fuer file://-Builds noetig
[project.plugins.offline]
enabled = false
